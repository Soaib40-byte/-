<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tournament App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #050b18;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #ff4757;
            --text: #ffffff;
        }

        body {
            background: radial-gradient(circle at top, #1a2a6c, #b21f1f, #fdbb2d);
            background-attachment: fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        .container { padding: 20px; max-width: 500px; margin: auto; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        #login-screen {
            display: flex;
            flex-direction: column;
            height: 90vh;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .telegram-btn {
            background: #0088cc;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .match-card {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .match-banner {
            height: 140px;
            background: url('https://img.freepik.com/premium-photo/fire-background-gaming-banner_1029473-195973.jpg') center/cover;
            display: flex;
            align-items: flex-end;
            font-weight: bold;
        }

        .banner-overlay {
            background: rgba(0,0,0,0.6);
            width: 100%;
            padding: 10px 15px;
        }

        .match-info { padding: 15px; }
        
        .match-details { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            font-size: 0.9em; 
        }

        .info-item { display: flex; align-items: center; gap: 8px; opacity: 0.9; }

        .countdown-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            color: #ffd700;
            font-weight: bold;
            margin: 15px 0;
            font-size: 0.9em;
        }

        .match-extra-buttons { display: flex; gap: 10px; margin-top: 5px; }

        .extra-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 0 0 15px 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-join { background: linear-gradient(to right, #00d2ff, #3a7bd5); color: white; }
        .btn-joined { background: #4b4b4b; color: #aaa; cursor: not-allowed; }

        .navbar {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            display: flex; justify-content: space-around;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .nav-item { color: #888; font-size: 1.2em; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); }

        .hidden { display: none !important; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
        }
        .modal-input {
            width: 100%; padding: 12px; margin: 15px 0;
            border-radius: 10px; border: 1px solid #00d2ff;
            background: rgba(255,255,255,0.1); color: white; outline: none;
            box-sizing: border-box;
        }

        .wallet-balance { font-size: 2em; font-weight: bold; color: #2ed573; margin: 10px 0; }
    </style>
</head>
<body>

<div id="login-screen" class="container">
    <div class="glass-card">
        <i class="fab fa-telegram-plane" style="font-size: 4em; color: #0088cc;"></i>
        <h1>Welcome Back</h1>
        <p>Login with Telegram to access matches</p>
        <button class="telegram-btn" onclick="login()">
            <i class="fab fa-telegram"></i> Login with Telegram
        </button>
    </div>
</div>

<div id="app-ui" class="hidden">
    <div id="home-sec" class="container">
        <h2 style="display:flex; justify-content: space-between; align-items: center;">
            Explore Games <span id="top-balance" style="font-size: 0.6em; background: #2ed573; padding: 5px 12px; border-radius: 20px;">৳ 0</span>
        </h2>
        <div class="match-card glass-card" onclick="showFFSection()" style="cursor: pointer;">
            <div class="match-banner"><div class="banner-overlay">FREE FIRE MAX</div></div>
            <div class="match-info">Matches Available</div>
        </div>
        <div class="match-card glass-card" style="opacity: 0.6;">
            <div class="match-banner" style="filter: grayscale(1);"><div class="banner-overlay">BLOOD STRIKE</div></div>
            <div class="match-info">Coming Soon...</div>
        </div>
    </div>

    <div id="ff-sec" class="container hidden">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
            <i class="fas fa-chevron-left" onclick="showHome()" style="cursor:pointer"></i>
            <h3>BR - Solo Matches</h3>
        </div>
        <div id="matchContainer"></div>
    </div>

    <div id="profile-sec" class="container hidden">
        <div class="glass-card" style="text-align:center;">
            <img src="https://ui-avatars.com/api/?name=User&background=00d2ff&color=fff" style="width:80px;border-radius:50%;border:3px solid var(--primary);">
            <h2 id="u-name">Player</h2>
            <p>@telegram_user</p>
        </div>
        <div style="display:flex;gap:15px;">
            <div class="glass-card" style="flex:1;text-align:center;">
                <p style="margin:0;font-size:0.9em;opacity:0.8;">Matches</p>
                <h3 id="matches-count" style="margin:5px 0 0 0;">0</h3>
            </div>
            <div class="glass-card" style="flex:1;text-align:center;">
                <p style="margin:0;font-size:0.9em;opacity:0.8;">Earnings</p>
                <h3 style="margin:5px 0 0 0;">৳ 0</h3>
            </div>
        </div>
    </div>

    <div id="wallet-sec" class="container hidden">
        <div class="glass-card" style="text-align:center;">
            <h3>My Wallet</h3>
            <div class="wallet-balance">৳ <span id="current-balance">0</span></div>
            <div style="display:flex;gap:10px;">
                <button class="telegram-btn" style="flex:1;background:#2196f3;" onclick="showAddMoney()"><i class="fas fa-plus"></i> Add Money</button>
                <button class="telegram-btn" style="flex:1;background:#4caf50;" onclick="handleWithdraw()"><i class="fas fa-university"></i> Withdraw</button>
            </div>
        </div>
        <div id="add-money-list" class="hidden">
            <h4>Select Method</h4>
            <div class="glass-card" onclick="payVia('Bkash')" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
                <span>Bkash Payment</span><i class="fas fa-chevron-right"></i>
            </div>
            <div class="glass-card" style="opacity:0.5;">Nagad (Coming Soon)</div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-item active" id="n-home" onclick="showHome()"><i class="fas fa-home"></i></div>
        <div id="n-wallet" class="nav-item" onclick="showWallet()"><i class="fas fa-wallet"></i></div>
        <div id="n-profile" class="nav-item" onclick="showProfile()"><i class="fas fa-user"></i></div>
    </nav>
</div>

<div id="custom-modal" class="modal-overlay hidden">
    <div class="glass-card" style="width: 90%; max-width: 350px; text-align: center;">
        <h3 id="modal-title">Title</h3>
        <p id="modal-desc" style="font-size: 0.9em; opacity: 0.8;"></p>
        <input type="text" id="modal-input" class="modal-input">
        <div style="display: flex; gap: 10px;">
            <button onclick="closeModal()" style="flex:1; padding:12px; border-radius:10px; border:none; background:#ff4757; color:white;">Cancel</button>
            <button id="modal-confirm" style="flex:1; padding:12px; border-radius:10px; border:none; background:#2ed573; color:white;">Confirm</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDgBrES-3lWjeFVo6vz3jfMOyCl_tgy_RQ",
        authDomain: "tournament-hub-a936a.firebaseapp.com",
        databaseURL: "https://tournament-hub-a936a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tournament-hub-a936a",
        storageBucket: "tournament-hub-a936a.appspot.com",
        messagingSenderId: "968072956918",
        appId: "1:968072956918:web:fee6b8c7cfdf1f77c115d7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let balance = 0;
    let mCount = 0;
    let userId = localStorage.getItem("uid") || ("uid_" + Date.now());
    localStorage.setItem("uid", userId);

    function login() { localStorage.setItem('loggedIn', 'true'); checkAuth(); }

    function checkAuth() {
        if(localStorage.getItem('loggedIn')) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-ui').classList.remove('hidden');
            db.ref("users/" + userId + "/balance").on("value", snap => {
                balance = snap.val() || 0;
                updateUI();
            });
            db.ref("users/" + userId + "/matches").on("value", snap => {
                mCount = snap.val() || 0;
                updateUI();
            });
        }
    }

    function updateUI() {
        document.getElementById('current-balance').innerText = balance;
        document.getElementById('top-balance').innerText = "৳ " + balance;
        document.getElementById('matches-count').innerText = mCount;
    }

    // Live Timer Function
    function startLiveTimer(targetTime, elementId) {
        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = new Date(targetTime).getTime() - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const display = document.getElementById(elementId);
            if (!display) { clearInterval(x); return; }

            if (distance < 0) {
                clearInterval(x);
                display.innerHTML = "MATCH STARTED";
            } else {
                display.innerHTML = `<i class="fas fa-clock"></i> Format: ${days}d ${hours}h ${minutes}m ${seconds}s`;
            }
        }, 1000);
    }

    db.ref('matches').on('value', (snap) => {
        const container = document.getElementById('matchContainer');
        container.innerHTML = '';
        snap.forEach((child) => {
            const m = child.val();
            const mId = child.key;

            if (m.game === "Free Fire") {
                const card = document.createElement('div');
                card.className = 'match-card glass-card';
                card.innerHTML = `
                    <div class="match-banner">
                        <div class="banner-overlay">
                            ${m.title}<br>
                            <small style="font-size:0.7em; color:#00d2ff;"><i class="fas fa-calendar-alt"></i> ${m.time.replace('T', ', ')}</small>
                        </div>
                    </div>
                    <div class="match-info">
                        <div class="match-details">
                            <div class="info-item"><i class="fas fa-money-bill"></i> Entry: ৳${m.entryFee}</div>
                            <div class="info-item"><i class="fas fa-trophy"></i> Prize: ৳${m.prize}</div>
                            <div class="info-item"><i class="fas fa-gamepad"></i> Mode: ${m.type}</div>
                            <div class="info-item" id="joined-count-${mId}"><i class="fas fa-users"></i> Joined: 0/${m.limit || 48}</div>
                        </div>
                        <div class="match-extra-buttons">
                            <button class="extra-btn" onclick="showDetails('${mId}')"><i class="fas fa-info-circle"></i> Details</button>
                            <button class="extra-btn" onclick="showPlayers('${mId}')"><i class="fas fa-list"></i> Players</button>
                        </div>
                        <div class="countdown-box" id="timer-${mId}">Calculating time...</div>
                    </div>
                    <button id="join-btn-${mId}" class="btn-action btn-join" onclick="handleJoin('${mId}', ${m.entryFee})">JOIN NOW</button>
                `;
                container.appendChild(card);

                // Live Joined Count
                db.ref("matchPlayers/" + mId).on('value', pSnap => {
                    const count = pSnap.numChildren();
                    const el = document.getElementById(`joined-count-${mId}`);
                    if(el) el.innerHTML = `<i class="fas fa-users"></i> Joined: ${count}/${m.limit || 48}`;
                });

                // Start Timer
                startLiveTimer(m.time, `timer-${mId}`);

                // Check Joined Status
                db.ref("users/" + userId + "/joinedMatches/" + mId).once("value", (jSnap) => {
                    if (jSnap.exists()) {
                        const btn = document.getElementById("join-btn-" + mId);
                        if (btn) { btn.innerText = "JOINED ✅"; btn.disabled = true; btn.className = "btn-action btn-joined"; }
                    }
                });
            }
        });
    });

    function handleJoin(matchId, entryFee) {
        openModal("Join Match", "আপনার Free Fire ID দিন", "PlayerName", (ign) => {
            if (!ign) return;
            if (balance < entryFee) { alert("❌ পর্যাপ্ত ব্যালেন্স নেই"); return; }

            db.ref("users/" + userId + "/joinedMatches/" + matchId).once("value", snap => {
                if (snap.exists()) { alert("⚠️ আপনি ইতিমধ্যে Join করেছেন"); return; }

                db.ref("users/" + userId + "/balance").set(balance - entryFee);
                db.ref("users/" + userId + "/joinedMatches/" + matchId).set({ ign: ign, time: Date.now() });
                db.ref("matchPlayers/" + matchId + "/" + userId).set({ gameName: ign, userId: userId });
                db.ref("users/" + userId + "/matches").transaction(c => (c || 0) + 1);
                alert("✅ Successfully Joined!");
            });
        });
    }

    function openModal(title, desc, placeholder, callback) {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        const input = document.getElementById('modal-input');
        input.placeholder = placeholder; input.value = "";
        modal.classList.remove('hidden');
        document.getElementById('modal-confirm').onclick = () => {
            if(input.value.trim() !== "") { callback(input.value); closeModal(); }
        };
    }

    function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); }
    function showHome() { hideAll(); document.getElementById('home-sec').classList.remove('hidden'); setActiveNav('n-home'); }
    function showFFSection() { hideAll(); document.getElementById('ff-sec').classList.remove('hidden'); }
    function showProfile() { hideAll(); document.getElementById('profile-sec').classList.remove('hidden'); setActiveNav('n-profile'); }
    function showWallet() { hideAll(); document.getElementById('wallet-sec').classList.remove('hidden'); setActiveNav('n-wallet'); }
    function hideAll() { ['home-sec', 'ff-sec', 'profile-sec', 'wallet-sec'].forEach(s => document.getElementById(s).classList.add('hidden')); }
    function setActiveNav(id) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function showAddMoney() { document.getElementById('add-money-list').classList.remove('hidden'); }
    
    function payVia(method) {
        openModal("Add Money", "কত টাকা পাঠিয়েছেন?", "50", (amt) => {
            setTimeout(() => {
                openModal("Transaction ID", method + " Transaction ID দিন", "TRX123", (tid) => {
                    db.ref("depositRequests").push({ userId: userId, method: method, amount: amt, transactionId: tid, status: "pending", time: Date.now() });
                    alert("✅ Request Sent!");
                });
            }, 300);
        });
    }

    function handleWithdraw() {
        openModal("Withdraw", "Amount? (Min 50)", "50", (amt) => {
            if (balance < amt || amt < 50) { alert("❌ Invalid Amount"); return; }
            setTimeout(() => {
                openModal("Number", "Bkash/Nagad Number", "017...", (num) => {
                    db.ref("withdrawRequests").push({ userId: userId, amount: amt, accountNumber: num, status: "pending", time: Date.now() });
                    db.ref("users/" + userId + "/balance").set(balance - amt);
                    alert("✅ Request Sent!");
                });
            }, 300);
        });
    }

    function showPlayers(matchId) {
        db.ref("matchPlayers/" + matchId).once("value", (snap) => {
            if (!snap.exists()) { alert("এখনো কেউ জয়েন করেনি!"); return; }
            let list = "Players:\n";
            snap.forEach((c) => { list += "- " + c.val().gameName + "\n"; });
            alert(list);
        });
    }

    function showDetails(matchId) {
        db.ref("users/" + userId + "/joinedMatches/" + matchId).once("value", (jSnap) => {
            if (jSnap.exists()) {
                db.ref("matches/" + matchId).once("value", snap => {
                    const m = snap.val();
                    alert(`Room ID: ${m.roomId}\nPass: ${m.roomPass}`);
                });
            } else { alert("⚠️ জয়েন করুন আগে!"); }
        });
    }

    window.onload = checkAuth;
</script>
</body>
</html>
